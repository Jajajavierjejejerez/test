<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Songs</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f1c2c, #2c3e50);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        h1 { color: #1ed760; font-size: 1.5rem; margin-bottom: 5px; }
        .date { font-size: 0.85rem; color: #ddd; margin-bottom: 20px; }
        .song-box { background: rgba(0, 0, 0, 0.3); padding: 20px; border-radius: 12px; margin-top: 15px; }
        .song-link {
            display: inline-block;
            margin-top: 15px;
            background: #1ed760;
            color: #000;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #bbb;
            text-decoration: none;
            font-size: 0.85rem;
        }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎵 Songs 🎵</h1>
    <div class="date" id="currentDate"></div>

    <div class="song-box">
        <p id="songText" style="font-size: 1.1rem; font-weight: bold;"></p>
        <a id="songLink" class="song-link" href="#" target="_blank">Listen on Spotify ↗</a>
    </div>

    <a href="index.html" class="back-link">← Back to Charms Menu</a>
</div>

<script>
    document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

    const start = new Date(new Date().getFullYear(), 0, 0);
    const dayOfYear = Math.floor((new Date() - start) / (1000 * 60 * 60 * 24));

    const songs = [
        { title: "Dreams - Fleetwood Mac (1977)", url: "https://open.spotify.com/track/0ofHAoxe9vBkTCp2UQIavz" },
        { title: "Take On Me - a-ha (1985)", url: "https://open.spotify.com/track/2WfaOiMkCvy7F5fcp2zZ8L" },
        { title: "Mr. Brightside - The Killers (2003)", url: "https://open.spotify.com/track/03S0yGVPVCcWnBTQKXVJWK" },
        { title: "September - Earth, Wind & Fire (1978)", url: "https://open.spotify.com/track/2grjqc6aPIr8d7fD8Z6G0i" },
        { title: "As It Was - Harry Styles (2022)", url: "https://open.spotify.com/track/4Dvkj6JhhA12EX05fT7y2e" }
    ];

    const selectedSong = songs[dayOfYear % songs.length];
    document.getElementById('songText').innerText = selectedSong.title;
    document.getElementById('songLink').href = selectedSong.url;
</script>

</body>
</html>
